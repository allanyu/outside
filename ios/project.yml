# Regenerate AgentInbox.xcodeproj with:  xcodegen generate
# (the generated project is committed, so a fresh clone can just open it)
name: AgentInbox
options:
  bundleIdPrefix: com.allanyu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # ---- the one thing to edit ----
    PRODUCT_BUNDLE_IDENTIFIER: com.allanyu.agentinbox
    # -------------------------------
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  AgentInbox:
    type: application
    platform: iOS
    sources:
      - path: AgentInbox
    settings:
      base:
        PRODUCT_NAME: AgentInbox
        INFOPLIST_KEY_CFBundleDisplayName: Agent Inbox
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AgentInbox/Info.plist
